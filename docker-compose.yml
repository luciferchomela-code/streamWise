services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: youtube_clone
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status(); } catch (error) {
          if (error.code !== 94) throw error;
          rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); }
          quit(db.hello().isWritablePrimary ? 0 : 1);'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-streamwise}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-streamwise-local}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  auth-service:
    build:
      context: ./services
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      PORT: 5001
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/streamwise?replicaSet=rs0}
      MONGO_DB_NAME: streamwise
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  video-metadata:
    build:
      context: ./services
      dockerfile: video-metadata/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5004:5002"
    environment:
      PORT: 5002
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/streamwise?replicaSet=rs0}
      MONGO_DB_NAME: streamwise
      REDIS_URL: redis://redis:6379
      USE_REDIS: "true"
      RABBITMQ_URL: ${COMPOSE_RABBITMQ_URL:-amqp://streamwise:streamwise-local@rabbitmq:5672}
      RABBITMQ_EXCHANGE: youtube.events
      UPLOAD_SERVICE_URL: http://upload:5003
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  upload:
    build:
      context: ./services/upload
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5003:5003"
    environment:
      PORT: 5003
      VIDEO_METADATA_INTERNAL_URL: http://video-metadata:5002
    depends_on:
      video-metadata:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    build:
      context: ./services/api-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
      USE_REDIS: "true"
      AUTH_SERVICE_URL: http://auth-service:5001
      VIDEO_METADATA_SERVICE_URL: http://video-metadata:5002
      UPLOAD_SERVICE_URL: http://upload:5003
    depends_on:
      auth-service:
        condition: service_healthy
      video-metadata:
        condition: service_healthy
      upload:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  recommendation-service:
    build:
      context: ./services/recommendation-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      RABBITMQ_URL: ${COMPOSE_RABBITMQ_URL:-amqp://streamwise:streamwise-local@rabbitmq:5672}
      RABBITMQ_EXCHANGE: youtube.events
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; exit(0 if urlopen('http://localhost:8000/health').status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
